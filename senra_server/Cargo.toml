[package]
name = "senra_server"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
async-trait = { version = "0.1", default-features = false }
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "matched-path", "original-uri", "query", "tokio", "tower-log", "tracing", "ws"] }
bcrypt = { version = "0.17", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["rayon", "jpeg", "png", "webp"] }
mime = { version = "0.3", default-features = false }
senra_api = { workspace = true, features = ["docs"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
sqlx = { version = "0.8", default-features = false, features = ["any", "macros", "json", "migrate", "sqlite", "runtime-tokio", "tls-native-tls", "time"] }
time = { workspace = true, features = ["serde", "std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false, features = ["cors", "trace"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "std"] }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
thiserror = { workspace = true, features = ["std"] }
utoipa.workspace = true

[dev-dependencies]
http-body-util = "0.1"
