[package]
name = "senra_client"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes = { version = "1", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["alloc", "sink"] }
http.workspace = true
log = { version = "0.4", default-features = false }
reqwest = { version = "0.13", features = ["json"] }
senra_api.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["net", "time"] }
tokio-tungstenite = { version = "0.28", features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
futures-channel = { version = "0.3", default-features = false, features = ["alloc"] }
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["BinaryType", "Blob", "CloseEvent", "DomException", "ErrorEvent", "MessageEvent", "Storage", "WebSocket", "Window"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
env_logger = "0.11"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["serde", "v4"] }
